[workspace]
authors = ["Anthony J. Clark <anthonyjclark@gmail.com>"]
channels = ["conda-forge"]
name = "lwmr"
version = "0.1.0"
platforms = [ { platform = "linux-64", cuda = "12" }, "osx-arm64" ]

[tasks]

[dependencies]
python = "3.12.*"

newton-all = ">=1.5.1,<1.6"

gymnasium = ">=1.3.0,<2"
loguru = ">=0.7.3,<0.8"
nodeenv = ">=1.9.1,<2"
tyro = ">=1.0.15,<2"

[target.linux.dependencies]
pytorch-gpu = ">=2.12.0,<3"

[target.osx-arm64.dependencies]
pytorch = ">=2.12.0,<3"

[pypi-dependencies]
lwmr = { path = "./packages/lwmr/", editable = true }
